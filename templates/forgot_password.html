{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe · Khedma Marrakech{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-side">
    <span class="logo big has-img"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Khedma Marrakech"></span>
    <h1>Mot de passe oublié ?</h1>
    <p>Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>
  </div>
  <form class="auth-form" method="post">
    <h2>Réinitialisation</h2>
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <button class="btn primary">Envoyer le lien</button>
    <p class="muted"><a href="{{ url_for('login') }}">Retour à la connexion</a></p>
  </form>
</section>
{% endblock %}
