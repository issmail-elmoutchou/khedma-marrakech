{% extends "base.html" %}
{% block title %}Nouveau mot de passe · Khedma Marrakech{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-side">
    <span class="logo big has-img"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Khedma Marrakech"></span>
    <h1>Nouveau mot de passe</h1>
    <p>Veuillez entrer votre nouveau mot de passe ci-dessous.</p>
  </div>
  <form class="auth-form" method="post">
    <h2>Créer un nouveau mot de passe</h2>
    <label>Nouveau mot de passe<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn primary">Enregistrer le nouveau mot de passe</button>
  </form>
</section>
{% endblock %}
